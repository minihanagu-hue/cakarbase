<g fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round"><rect x="17.5" y="17.5" width="13" height="13" rx="2" stroke="none"/><circle cx="24" cy="24" r="14.5" fill="none" stroke-width="2.4"/></g>
